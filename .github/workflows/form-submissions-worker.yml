name: Worker de formulário (anúncios)

on:
  pull_request:
    branches:
      - foundation/bootstrap-monorepo
      - main
    paths:
      - "workers/form-submissions/**"
      - "sites/alto-araguaia-imoveis/src/components/ContactForm.astro"
      - "sites/alto-araguaia-imoveis/src/pages/anuncie-seu-imovel.astro"
      - "sites/alto-araguaia-imoveis/test/**"
      - ".github/workflows/form-submissions-worker.yml"
  push:
    branches:
      - foundation/bootstrap-monorepo
      - main
    paths:
      - "workers/form-submissions/**"
      - "sites/alto-araguaia-imoveis/src/components/ContactForm.astro"
      - "sites/alto-araguaia-imoveis/src/pages/anuncie-seu-imovel.astro"
      - "sites/alto-araguaia-imoveis/test/**"
      - ".github/workflows/form-submissions-worker.yml"

permissions:
  contents: read

concurrency:
  group: form-submissions-worker-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Worker e contrato do formulário
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 26.13.0

      - name: Sintaxe do Worker
        run: node --check workers/form-submissions/index.mjs

      - name: Testes do Worker
        run: node --test workers/form-submissions/test/*.test.mjs

      - name: Contrato do formulário no site
        run: node --test sites/alto-araguaia-imoveis/test/*.test.mjs

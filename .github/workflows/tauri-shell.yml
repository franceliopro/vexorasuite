name: Tauri v2 shell

on:
  pull_request:
    branches:
      - foundation/bootstrap-monorepo
      - main
  push:
    branches:
      - foundation/bootstrap-monorepo
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tauri-shell-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  config:
    name: Config and static guards
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.22.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 26.13.0

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Static config guards
        run: pnpm --filter @vexorasuite/shell test

      - name: Validate config with Tauri CLI
        run: pnpm --filter @vexorasuite/shell exec tauri info
        env:
          CI: "true"

      # Android is compiled in its own job with SDK/NDK. iOS needs macOS/Xcode,
      # so it remains configuration-only in this runner.
      - name: iOS remains config-only in this runner
        run: echo "iOS is configured but not built on ubuntu-latest."

  desktop:
    name: Desktop build check (Linux)
    needs: config
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.22.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 26.13.0

      - name: Install Linux WebKit build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential curl wget file libxdo-dev libssl-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Cargo check
        run: cargo check --manifest-path apps/shell/src-tauri/Cargo.toml

      - name: Tauri build without installers
        run: pnpm --filter @vexorasuite/shell exec tauri build --no-bundle --ci

      - name: No installer published
        run: echo "Build check only; this workflow does not sign, upload or publish a binary."

  windows:
    name: Windows NSIS build check
    needs: config
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.22.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 26.13.0

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build NSIS installer
        run: pnpm --filter @vexorasuite/shell exec tauri build --ci --bundles nsis

      - name: Verify NSIS artifact
        shell: pwsh
        run: |
          $installer = Get-ChildItem -Path "apps/shell/src-tauri/target/release/bundle/nsis" -Filter "*.exe" -File
          if (-not $installer) { throw "No NSIS installer was produced." }

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: vexora-shell-windows-nsis
          path: apps/shell/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

      - name: No signing or release
        run: echo "Unsigned NSIS artifact only; no code signing, release or publication."

  android:
    name: Android build check (signed preview APK)
    needs: config
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      ANDROID_NDK_VERSION: 27.2.12479018
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK and NDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-35 build-tools;35.0.0 platform-tools ndk;${{ env.ANDROID_NDK_VERSION }}"

      - name: Expose NDK home
        run: echo "NDK_HOME=$ANDROID_HOME/ndk/${{ env.ANDROID_NDK_VERSION }}" >> "$GITHUB_ENV"

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.22.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 26.13.0

      - name: Install Rust with Android targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Initialize Android project
        run: pnpm --filter @vexorasuite/shell exec tauri android init --ci --skip-targets-install

      - name: Build unsigned APKs
        run: pnpm --filter @vexorasuite/shell exec tauri android build --ci --apk

      - name: Verify APK artifact
        shell: bash
        run: |
          test -n "$(find apps/shell/src-tauri/gen/android/app/build/outputs/apk -name '*.apk' -print -quit)"

      - name: Upload unsigned Android artifact
        uses: actions/upload-artifact@v4
        with:
          name: vexora-shell-android-unsigned-apk
          path: apps/shell/src-tauri/gen/android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error

      - name: Sign preview APK with an ephemeral key
        shell: bash
        run: |
          set -euo pipefail
          APK=$(find apps/shell/src-tauri/gen/android/app/build/outputs/apk -name 'app-universal-release-unsigned.apk' -print -quit)
          test -n "$APK"
          export PATH="$ANDROID_HOME/build-tools/35.0.0:$PATH"
          STORE_PASS="$(openssl rand -hex 16)"
          keytool -genkeypair -v \
            -keystore "$RUNNER_TEMP/vexora-preview.jks" -storetype PKCS12 \
            -storepass "$STORE_PASS" -keypass "$STORE_PASS" \
            -alias vexora-preview -keyalg RSA -keysize 2048 -validity 3650 \
            -dname "CN=Vexora Suite Preview, OU=Preview, O=Vexora Suite, L=Sao Paulo, ST=SP, C=BR" >/dev/null 2>&1
          zipalign -p -f -v 4 "$APK" "$RUNNER_TEMP/app-universal-release-aligned.apk"
          apksigner sign \
            --ks "$RUNNER_TEMP/vexora-preview.jks" --ks-key-alias vexora-preview \
            --ks-pass "pass:$STORE_PASS" --key-pass "pass:$STORE_PASS" \
            --v1-signing-enabled true --v2-signing-enabled true \
            --out "$RUNNER_TEMP/Vexora-Suite-0.1.0-universal.apk" \
            "$RUNNER_TEMP/app-universal-release-aligned.apk"
          apksigner verify --verbose --print-certs \
            "$RUNNER_TEMP/Vexora-Suite-0.1.0-universal.apk"
          mkdir -p apps/shell/src-tauri/gen/android/app/build/outputs/apk/preview
          cp "$RUNNER_TEMP/Vexora-Suite-0.1.0-universal.apk" apps/shell/src-tauri/gen/android/app/build/outputs/apk/preview/Vexora-Suite-0.1.0-universal.apk
          echo "SIGNED_APK=apps/shell/src-tauri/gen/android/app/build/outputs/apk/preview/Vexora-Suite-0.1.0-universal.apk" >> "$GITHUB_ENV"

      - name: Upload signed preview APK
        uses: actions/upload-artifact@v4
        with:
          name: vexora-shell-android-signed-apk
          path: ${{ env.SIGNED_APK }}
          if-no-files-found: error

      - name: No store upload or automated release
        run: echo "Preview signature uses an ephemeral runner key; no Play Store upload or automated release."

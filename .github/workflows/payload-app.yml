name: Payload CMS app

on:
  pull_request:
    branches:
      - foundation/bootstrap-monorepo
      - main
    paths:
      - "infra/payload/**"
      - ".github/workflows/payload-app.yml"
  push:
    branches:
      - foundation/bootstrap-monorepo
      - main
    paths:
      - "infra/payload/**"
      - ".github/workflows/payload-app.yml"

permissions:
  contents: read

concurrency:
  group: payload-app-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Payload CMS app
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: infra/payload
    env:
      # Valores de CI apenas. Nao sao segredos e nunca chegam a producao.
      DATABASE_URL: postgres://ci:ci@127.0.0.1:5432/payload_ci
      PAYLOAD_SECRET: ci-placeholder-not-a-production-secret
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.22.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.23.5

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Type-check
        run: pnpm run typecheck

      - name: Build
        run: pnpm build
name: Site Template Astro

on:
  pull_request:
    branches:
      - foundation/bootstrap-monorepo
    paths:
      - "sites/_template/**"
      - ".github/workflows/site-astro-template.yml"
  push:
    branches:
      - foundation/bootstrap-monorepo
    paths:
      - "sites/_template/**"
      - ".github/workflows/site-astro-template.yml"

permissions:
  contents: read

concurrency:
  group: site-astro-template-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Check, build and audit Astro template
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: sites/_template
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.22.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: sites/_template/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type-check
        run: pnpm check

      - name: Build static site
        run: pnpm build

      - name: Verify static output
        run: |
          test -f dist/index.html
          test -f dist/sobre/index.html
          test -f dist/contato/index.html
          test -f dist/404.html
          test -f dist/sitemap.xml
          test -f dist/robots.txt

      - name: Audit local links and assets
        run: node scripts/audit-links.mjs dist

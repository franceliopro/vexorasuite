name: Payload CMS app

on:
  pull_request:
    branches:
      - foundation/bootstrap-monorepo
      - main
    paths:
      - "infra/payload/**"
      - ".github/workflows/payload-app.yml"
  push:
    branches:
      - foundation/bootstrap-monorepo
      - main
    paths:
      - "infra/payload/**"
      - ".github/workflows/payload-app.yml"

permissions:
  contents: read

concurrency:
  group: payload-app-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Payload CMS app
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: infra/payload
    env:
      # Valores de CI apenas. Nao sao segredos e nunca chegam a producao.
      DATABASE_URL: postgres://ci:ci@127.0.0.1:5432/payload_ci
      PAYLOAD_SECRET: ci-placeholder-not-a-production-secret
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.22.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.23.5

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Type-check
        run: pnpm run typecheck

      - name: Build
        run: pnpm build

  smoke:
    name: Boot Payload with production migrations
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: infra/payload
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: payload_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d payload_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://ci:ci@127.0.0.1:5432/payload_ci
      PAYLOAD_SECRET: ci-placeholder-not-a-production-secret
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.22.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.23.5

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build standalone server
        run: pnpm build

      - name: Start production server and initialize Payload
        run: |
          mkdir -p .next/standalone/.next/static
          cp -R .next/static/. .next/standalone/.next/static/
          NODE_ENV=production PORT=3000 HOSTNAME=127.0.0.1 \
            node .next/standalone/server.js > /tmp/payload-server.log 2>&1 &
          echo $! > /tmp/payload-server.pid
          for attempt in $(seq 1 90); do
            if curl -fsS http://127.0.0.1:3000/admin -o /tmp/payload-admin.html; then
              echo "Studio respondeu apos ${attempt}s"
              exit 0
            fi
            if ! kill -0 "$(cat /tmp/payload-server.pid)" 2>/dev/null; then
              echo "Servidor encerrou antes de responder"
              cat /tmp/payload-server.log
              exit 1
            fi
            sleep 1
          done
          echo "Servidor nao respondeu a tempo"
          cat /tmp/payload-server.log
          exit 1

      - name: Verify initial migration was applied
        run: |
          export PGPASSWORD=ci
          psql -h 127.0.0.1 -U ci -d payload_ci -tAc \
            "SELECT to_regclass('public.users')" | grep -qx users
          psql -h 127.0.0.1 -U ci -d payload_ci -tAc \
            "SELECT count(*) FROM payload_migrations" | grep -qv '^ *0 *$'

      - name: Stop server
        if: always()
        run: |
          if [ -f /tmp/payload-server.pid ]; then kill "$(cat /tmp/payload-server.pid)" 2>/dev/null || true; fi
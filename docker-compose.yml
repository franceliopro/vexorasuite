services:
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-https://app.vexorasuite.com.br}
      API_INTERNAL_URL: http://api:3001
    expose:
      - "3000"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  api:
    volumes:
      - automation_media:/var/lib/vexora/media
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      API_PORT: "3001"
      CORS_ORIGINS: ${CORS_ORIGINS:-https://app.vexorasuite.com.br}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?Configure JWT_ACCESS_SECRET no Dokploy}
      PUBLIC_APP_URL: ${PUBLIC_APP_URL:-https://app.vexorasuite.com.br}
      # A API fala com o serviço WAHA pela rede interna do Compose. No Dokploy, sobrescreva apenas se o WAHA estiver fora deste stack.\n      WAHA_BASE_URL: ${WAHA_BASE_URL:-http://waha:3000}
      WAHA_API_KEY: ${WAHA_API_KEY:-}
      ZERNIO_API_KEY: ${ZERNIO_API_KEY:-}
      ZERNIO_WEBHOOK_SECRET: ${ZERNIO_WEBHOOK_SECRET:-}
      BRAVE_SEARCH_API_KEY: ${BRAVE_SEARCH_API_KEY:-}
      SEARXNG_URL: http://searxng:8080
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-}
      OLLAMA_DEFAULT_MODEL: ${OLLAMA_DEFAULT_MODEL:-qwen2.5:1.5b}
      LOCAL_VOICE_URL: ${LOCAL_VOICE_URL:-}
      LOCAL_TTS_VOICE: ${LOCAL_TTS_VOICE:-pf_dora}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      INTEGRATION_ENCRYPTION_KEY: ${INTEGRATION_ENCRYPTION_KEY:-}
      GOOGLE_MAPS_API_KEY: ${GOOGLE_MAPS_API_KEY:-}
      API_PUBLIC_URL: ${API_PUBLIC_URL:-https://api.vexorasuite.com.br}
      WEB_PUBLIC_URL: ${WEB_PUBLIC_URL:-https://app.vexorasuite.com.br}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_TOKEN_ENCRYPTION_KEY: ${GOOGLE_TOKEN_ENCRYPTION_KEY:-}
      DATABASE_URL: postgresql://${POSTGRES_USER:-vexora}:${POSTGRES_PASSWORD:?Configure POSTGRES_PASSWORD no Dokploy}@postgres:5432/${POSTGRES_DB:-vexorasuite}
      REDIS_URL: redis://redis:6379
    expose:
      - "3001"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  ollama:
    profiles: ["local-ai"]
    image: ollama/ollama:latest
    restart: unless-stopped
    environment:
      OLLAMA_NUM_PARALLEL: "1"
      OLLAMA_MAX_LOADED_MODELS: "1"
      OLLAMA_CONTEXT_LENGTH: "4096"
    volumes:
      - ollama_models:/root/.ollama
    expose:
      - "11434"
    mem_limit: 4g
    cpus: 2
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 30s
      timeout: 5s
      retries: 3
  ollama-model:
    profiles: ["local-ai"]
    image: ollama/ollama:latest
    restart: "no"
    environment:
      OLLAMA_HOST: http://ollama:11434
    command: ["pull", "${OLLAMA_DEFAULT_MODEL:-qwen2.5:1.5b}"]
    depends_on:
      ollama:
        condition: service_healthy
    mem_limit: 256m
  speaches:
    profiles: ["local-ai"]
    image: ghcr.io/speaches-ai/speaches:latest-cpu
    restart: unless-stopped
    environment:
      ENABLE_UI: "false"
      LOG_LEVEL: warning
      WHISPER__INFERENCE_DEVICE: cpu
      WHISPER__COMPUTE_TYPE: int8
      WHISPER__CPU_THREADS: "1"
      # Speaches v0.8.2 shares this TTL across STT and TTS.
      # Release each model after use to stay within the 2 GiB memory limit.
      WHISPER__TTL: "0"
      PRELOAD_MODELS: '["Systran/faster-whisper-small", "speaches-ai/Kokoro-82M-v1.0-ONNX"]'
    volumes:
      - speech_models:/home/ubuntu/.cache/huggingface/hub
    expose:
      - "8000"
    mem_limit: 2g
    cpus: 1
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  lightweight-text-models:
    profiles: ["local-ai"]
    image: python:3.12-alpine
    restart: "on-failure:3"
    command: ["python", "-u", "/opt/vexora/install-text-models.py"]
    volumes:
      - ./infra/speaches/install-text-models.py:/opt/vexora/install-text-models.py:ro
    depends_on:
      ollama:
        condition: service_healthy
    mem_limit: 64m
    cpus: 0.25

  speech-models:
    profiles: ["local-ai"]
    image: python:3.12-alpine
    restart: "on-failure:3"
    command: ["python", "-u", "/opt/vexora/install-models.py"]
    volumes:
      - ./infra/speaches/install-models.py:/opt/vexora/install-models.py:ro
    depends_on:
      speaches:
        condition: service_healthy
    mem_limit: 64m
    cpus: 0.25

  searxng:
    image: docker.io/searxng/searxng:latest
    restart: unless-stopped
    entrypoint: ["/bin/sh", "/opt/vexora/start.sh"]
    environment:
      GRANIAN_WORKERS: "1"
      GRANIAN_BLOCKING_THREADS: "2"
    volumes:
      - ./infra/searxng/settings.yml:/opt/vexora/settings.yml:ro
      - ./infra/searxng/start.sh:/opt/vexora/start.sh:ro
      - searxng_config:/etc/searxng
      - searxng_data:/var/cache/searxng
    expose:
      - "8080"
    mem_limit: 512m
    cpus: 0.5
    healthcheck:
      test: ["CMD", "/usr/local/searxng/.venv/bin/python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-vexora}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Configure POSTGRES_PASSWORD no Dokploy}
      POSTGRES_DB: ${POSTGRES_DB:-vexorasuite}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-vexora} -d ${POSTGRES_DB:-vexorasuite}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  pgadmin:
    profiles: ["maintenance"]
    image: dpage/pgadmin4:latest
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:?Configure PGADMIN_DEFAULT_EMAIL no Dokploy}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:?Configure PGADMIN_DEFAULT_PASSWORD no Dokploy}
      PGADMIN_LISTEN_PORT: "80"
      PGADMIN_CONFIG_ENHANCED_COOKIE_PROTECTION: "True"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    expose:
      - "80"
    depends_on:
      postgres:
        condition: service_healthy

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    expose:
      - "6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10


  waha:
    image: devlikeapro/waha:latest
    restart: unless-stopped
    environment:
      WAHA_API_KEY: ${WAHA_API_KEY:?Configure WAHA_API_KEY no Dokploy}
      WHATSAPP_DEFAULT_ENGINE: WEBJS
    expose:
      - "3000"
    volumes:
      - waha_sessions:/app/.sessions

volumes:
  ollama_models:
  speech_models:
  searxng_config:
  searxng_data:
  automation_media:
  postgres_data:
  redis_data:
  pgadmin_data:
  waha_sessions:

name: Generate Payload initial migration

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generate:
    name: Generate initial Postgres migration
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: infra/payload
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: payload_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d payload_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://ci:ci@127.0.0.1:5432/payload_ci
      PAYLOAD_SECRET: ci-placeholder-not-a-production-secret
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.22.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.23.5

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Create initial migration
        run: pnpm payload migrate:create initial --skip-empty

      - name: Upload generated migration
        uses: actions/upload-artifact@v4
        with:
          name: payload-initial-migration
          path: infra/payload/src/migrations
          if-no-files-found: error

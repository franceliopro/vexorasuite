name: Schools service contract

on:
  pull_request:
    branches:
      - foundation/bootstrap-monorepo
      - main
    paths:
      - "infra/schools/**"
      - "apps/web/test/schools-compose-contract.test.mjs"
      - "docs/deployment-dokploy.md"
      - ".github/workflows/schools-contract.yml"
  push:
    branches:
      - foundation/bootstrap-monorepo
      - main
    paths:
      - "infra/schools/**"
      - "apps/web/test/schools-compose-contract.test.mjs"
      - "docs/deployment-dokploy.md"
      - ".github/workflows/schools-contract.yml"

permissions:
  contents: read

concurrency:
  group: schools-contract-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    name: Static contract guards
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # Valores de CI apenas. Nao sao segredos e nunca chegam a producao.
      SCHOOLS_POSTGRES_USER: ci
      SCHOOLS_POSTGRES_PASSWORD: ci-placeholder-not-a-production-secret
      SCHOOLS_POSTGRES_DB: schools_ci
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.23.5

      - name: Validate compose interpolation
        run: docker compose -f infra/schools/docker-compose.yml config > /tmp/schools-compose.resolved.yml

      - name: Contract tests
        run: node --test apps/web/test/schools-compose-contract.test.mjs

  migration:
    name: Initdb migration and tenant link uniqueness
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Valores de CI apenas. Nao sao segredos e nunca chegam a producao.
      SCHOOLS_POSTGRES_USER: ci
      SCHOOLS_POSTGRES_PASSWORD: ci-placeholder-not-a-production-secret
      SCHOOLS_POSTGRES_DB: schools_ci
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Start isolated database
        run: docker compose -f infra/schools/docker-compose.yml up -d database

      - name: Wait for healthy database
        run: |
          for attempt in $(seq 1 60); do
            if docker compose -f infra/schools/docker-compose.yml exec -T database \
              pg_isready -U "$SCHOOLS_POSTGRES_USER" -d "$SCHOOLS_POSTGRES_DB" >/dev/null 2>&1; then
              echo "Postgres pronto apos ${attempt}s"
              exit 0
            fi
            sleep 1
          done
          docker compose -f infra/schools/docker-compose.yml logs database
          exit 1

      - name: Verify migration applied on initdb
        run: |
          docker compose -f infra/schools/docker-compose.yml exec -T database \
            psql -v ON_ERROR_STOP=1 -U "$SCHOOLS_POSTGRES_USER" -d "$SCHOOLS_POSTGRES_DB" -tAc \
            "SELECT to_regclass('public.tenant_links')" | grep -qx tenant_links

      - name: Verify tenant scoped uniqueness
        run: |
          set -euo pipefail
          DC="docker compose -f infra/schools/docker-compose.yml exec -T database psql -v ON_ERROR_STOP=1 -U $SCHOOLS_POSTGRES_USER -d $SCHOOLS_POSTGRES_DB"
          $DC -c "INSERT INTO tenant_links (tenant_id, provider, external_customer_id) VALUES ('11111111-1111-4111-8111-111111111111','SCHOOL_A','customer-1')" >/dev/null
          $DC -c "INSERT INTO tenant_links (tenant_id, provider, external_customer_id) VALUES ('22222222-2222-4222-8222-222222222222','SCHOOL_A','customer-1')" >/dev/null
          $DC -c "INSERT INTO tenant_links (tenant_id, provider, external_customer_id) VALUES ('11111111-1111-4111-8111-111111111111','SCHOOL_B','customer-1')" >/dev/null
          if $DC -c "INSERT INTO tenant_links (tenant_id, provider, external_customer_id) VALUES ('11111111-1111-4111-8111-111111111111','SCHOOL_A','customer-1')" >/dev/null 2>/tmp/schools-duplicate.err; then
            echo "Vinculo duplicado foi aceito"
            exit 1
          fi
          grep -q 'tenant_links_tenant_provider_customer_key' /tmp/schools-duplicate.err
          $DC -tAc "SELECT count(*) FROM tenant_links" | grep -qx 3

      - name: Stop isolated database
        if: always()
        run: docker compose -f infra/schools/docker-compose.yml down -v

name: Site Alto Araguaia Imóveis

on:
  pull_request:
    branches:
      - foundation/bootstrap-monorepo
    paths:
      - "sites/alto-araguaia-imoveis/**"
      - "sites/_template/**"
      - ".github/workflows/site-alto-araguaia-imoveis.yml"
  push:
    branches:
      - foundation/bootstrap-monorepo
    paths:
      - "sites/alto-araguaia-imoveis/**"
      - "sites/_template/**"
      - ".github/workflows/site-alto-araguaia-imoveis.yml"

permissions:
  contents: read

concurrency:
  group: site-alto-araguaia-imoveis-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Check, build and audit site
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: sites/alto-araguaia-imoveis
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.22.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: sites/alto-araguaia-imoveis/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type-check
        run: pnpm check

      - name: Build static site
        run: pnpm build

      - name: Verify static output
        run: |
          test -f dist/index.html
          test -f dist/imoveis/index.html
          test -f dist/imoveis/casa-centro/index.html
          test -f dist/imoveis/apartamento-jardim-america/index.html
          test -f dist/imoveis/terreno-zona-norte/index.html
          test -f dist/imoveis/casa-chacara-bela-vista/index.html
          test -f dist/imoveis/apartamento-vila-nova/index.html
          test -f dist/imoveis/galpao-distrito-industrial/index.html
          test -f dist/sobre/index.html
          test -f dist/contato/index.html
          test -f dist/404.html
          test -f dist/sitemap.xml
          test -f dist/robots.txt

      - name: Audit local links and assets
        run: node scripts/audit-links.mjs dist

name: vexora-documenso

# Stack separada da Véxora Suite. Sem banco, volume, domínio, segredos ou chaves compartilhadas.
# Documenso Community Edition (AGPL-3.0), imagem oficial, sem fork e sem modificação.
services:
  database:
    image: postgres:15
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DOCUMENSO_POSTGRES_USER:?Defina DOCUMENSO_POSTGRES_USER no cofre}
      POSTGRES_PASSWORD: ${DOCUMENSO_POSTGRES_PASSWORD:?Defina DOCUMENSO_POSTGRES_PASSWORD no cofre}
      POSTGRES_DB: ${DOCUMENSO_POSTGRES_DB:?Defina DOCUMENSO_POSTGRES_DB no cofre}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DOCUMENSO_POSTGRES_USER:-documenso} -d ${DOCUMENSO_POSTGRES_DB:-documenso}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    expose:
      - "5432"
    volumes:
      - documenso-pgdata:/var/lib/postgresql/data

  documenso:
    image: ${DOCUMENSO_IMAGE:-documenso/documenso:latest}
    restart: unless-stopped
    depends_on:
      database:
        condition: service_healthy
    environment:
      PORT: "3000"
      NEXTAUTH_SECRET: ${DOCUMENSO_NEXTAUTH_SECRET:?Defina DOCUMENSO_NEXTAUTH_SECRET no cofre}
      NEXT_PRIVATE_ENCRYPTION_KEY: ${DOCUMENSO_ENCRYPTION_KEY:?Defina DOCUMENSO_ENCRYPTION_KEY no cofre}
      NEXT_PRIVATE_ENCRYPTION_SECONDARY_KEY: ${DOCUMENSO_ENCRYPTION_SECONDARY_KEY:?Defina DOCUMENSO_ENCRYPTION_SECONDARY_KEY no cofre}
      NEXT_PUBLIC_WEBAPP_URL: ${DOCUMENSO_PUBLIC_URL:?Defina DOCUMENSO_PUBLIC_URL no Dokploy}
      NEXT_PRIVATE_INTERNAL_WEBAPP_URL: "http://127.0.0.1:3000"
      NEXT_PRIVATE_DATABASE_URL: postgresql://${DOCUMENSO_POSTGRES_USER:?Defina DOCUMENSO_POSTGRES_USER no cofre}:${DOCUMENSO_POSTGRES_PASSWORD:?Defina DOCUMENSO_POSTGRES_PASSWORD no cofre}@database:5432/${DOCUMENSO_POSTGRES_DB:?Defina DOCUMENSO_POSTGRES_DB no cofre}
      NEXT_PRIVATE_DIRECT_DATABASE_URL: postgresql://${DOCUMENSO_POSTGRES_USER:?Defina DOCUMENSO_POSTGRES_USER no cofre}:${DOCUMENSO_POSTGRES_PASSWORD:?Defina DOCUMENSO_POSTGRES_PASSWORD no cofre}@database:5432/${DOCUMENSO_POSTGRES_DB:?Defina DOCUMENSO_POSTGRES_DB no cofre}
      NEXT_PRIVATE_SMTP_TRANSPORT: ${DOCUMENSO_SMTP_TRANSPORT:-smtp-auth}
      NEXT_PRIVATE_SMTP_HOST: ${DOCUMENSO_SMTP_HOST:?Defina DOCUMENSO_SMTP_HOST no cofre}
      NEXT_PRIVATE_SMTP_PORT: ${DOCUMENSO_SMTP_PORT:-587}
      NEXT_PRIVATE_SMTP_USERNAME: ${DOCUMENSO_SMTP_USERNAME:?Defina DOCUMENSO_SMTP_USERNAME no cofre}
      NEXT_PRIVATE_SMTP_PASSWORD: ${DOCUMENSO_SMTP_PASSWORD:?Defina DOCUMENSO_SMTP_PASSWORD no cofre}
      NEXT_PRIVATE_SMTP_FROM_NAME: ${DOCUMENSO_SMTP_FROM_NAME:-Vexora Assinaturas}
      NEXT_PRIVATE_SMTP_FROM_ADDRESS: ${DOCUMENSO_SMTP_FROM_ADDRESS:?Defina DOCUMENSO_SMTP_FROM_ADDRESS no cofre}
      NEXT_PRIVATE_SIGNING_LOCAL_FILE_PATH: /opt/documenso/cert.p12
      NEXT_PRIVATE_SIGNING_PASSPHRASE: ${DOCUMENSO_SIGNING_PASSPHRASE:?Defina DOCUMENSO_SIGNING_PASSPHRASE no cofre}
    ports:
      - "${DOCUMENSO_PORT:-3000}:3000"
    volumes:
      - ${DOCUMENSO_CERT_PATH:?Defina DOCUMENSO_CERT_PATH no cofre}:/opt/documenso/cert.p12:ro

volumes:
  documenso-pgdata:

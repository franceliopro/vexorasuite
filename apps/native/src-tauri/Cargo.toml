[package]
name = "vexorasuite-native"
version = "0.1.0"
description = "Véxora Suite — native desktop and mobile wrapper"
authors = ["Véxora"]
edition = "2021"
rust-version = "1.77.2"
links = "vexorasuite_native"

[lib]
name = "vexorasuite_native_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = [] }

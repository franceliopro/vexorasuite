services:
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-https://app.vexorasuite.com.br}
      API_INTERNAL_URL: http://api:3001
    expose:
      - "3000"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  # Runs schema migrations once before API and workers start. It is intentionally
  # one-shot so every runtime process uses the same completed migration barrier.
  migration:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: "no"
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-vexora}:${POSTGRES_PASSWORD:?Configure POSTGRES_PASSWORD no Dokploy}@postgres:5432/${POSTGRES_DB:-vexorasuite}
    depends_on:
      postgres:
        condition: service_healthy
    command: ["./node_modules/.bin/prisma", "migrate", "deploy"]

  api:
    volumes:
      - automation_media:/var/lib/vexora/media
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      API_PORT: "3001"
      # The HTTP API never runs periodic work in production. The scheduler-worker below owns it.
      # Override only for a deliberate maintenance or local-development scenario.
      SCHEDULER_MODE: ${SCHEDULER_MODE:-worker}
      CORS_ORIGINS: ${CORS_ORIGINS:-https://app.vexorasuite.com.br}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?Configure JWT_ACCESS_SECRET no Dokploy}
      PUBLIC_APP_URL: ${PUBLIC_APP_URL:-https://app.vexorasuite.com.br}
      # A API fala com o serviço WAHA pela rede interna do Compose. No Dokploy, sobrescreva apenas se o WAHA estiver fora deste stack.
      WAHA_BASE_URL: ${WAHA_BASE_URL:-http://waha:3000}
      WAHA_API_KEY: ${WAHA_API_KEY:-}
      META_APP_ID: ${META_APP_ID:-}
      META_APP_SECRET: ${META_APP_SECRET:-}
      META_OAUTH_REDIRECT_URI: ${META_OAUTH_REDIRECT_URI:-}
      META_WEBHOOK_VERIFY_TOKEN: ${META_WEBHOOK_VERIFY_TOKEN:-}
      META_WEBHOOK_APP_SECRET: ${META_WEBHOOK_APP_SECRET:-}
      ZERNIO_API_KEY: ${ZERNIO_API_KEY:-}
      ZERNIO_WEBHOOK_SECRET: ${ZERNIO_WEBHOOK_SECRET:-}
      WEBHOOK_ENCRYPTION_KEY: ${WEBHOOK_ENCRYPTION_KEY:?Configure WEBHOOK_ENCRYPTION_KEY no Dokploy}
      BRAVE_SEARCH_API_KEY: ${BRAVE_SEARCH_API_KEY:-}
      SEARXNG_URL: http://searxng:8080
      LLAMA_CPP_BASE_URL: ${LLAMA_CPP_BASE_URL:-http://llama-cpp:8080}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-}
      OLLAMA_DEFAULT_MODEL: ${OLLAMA_DEFAULT_MODEL:-qwen2.5:1.5b}
      LOCAL_VOICE_URL: ${LOCAL_VOICE_URL:-}
      LOCAL_TTS_VOICE: ${LOCAL_TTS_VOICE:-pf_dora}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      # Necessária para cadastrar caixas IMAP/SMTP; a API permanece inicializável sem ela para não interromper o deploy existente.
      INTEGRATION_ENCRYPTION_KEY: ${INTEGRATION_ENCRYPTION_KEY:-}
      GOOGLE_MAPS_API_KEY: ${GOOGLE_MAPS_API_KEY:-}
      API_PUBLIC_URL: ${API_PUBLIC_URL:-https://api.vexorasuite.com.br}
      WEB_PUBLIC_URL: ${WEB_PUBLIC_URL:-https://app.vexorasuite.com.br}
      REALTIME_POLL_MS: ${REALTIME_POLL_MS:-5000}
      REALTIME_EVENT_RETENTION_DAYS: ${REALTIME_EVENT_RETENTION_DAYS:-7}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_TOKEN_ENCRYPTION_KEY: ${GOOGLE_TOKEN_ENCRYPTION_KEY:-}
      DATABASE_URL: postgresql://${POSTGRES_USER:-vexora}:${POSTGRES_PASSWORD:?Configure POSTGRES_PASSWORD no Dokploy}@postgres:5432/${POSTGRES_DB:-vexorasuite}
      REDIS_URL: redis://redis:6379
      # Rate limit uses the shared Redis counter and reads the real client IP from the proxy.
      RATE_LIMIT_ENABLED: ${RATE_LIMIT_ENABLED:-true}
      RATE_LIMIT_AUTH_PER_MIN: ${RATE_LIMIT_AUTH_PER_MIN:-10}
      RATE_LIMIT_AUTH_AUX_PER_MIN: ${RATE_LIMIT_AUTH_AUX_PER_MIN:-60}
      RATE_LIMIT_READ_PER_MIN: ${RATE_LIMIT_READ_PER_MIN:-900}
      RATE_LIMIT_WRITE_PER_MIN: ${RATE_LIMIT_WRITE_PER_MIN:-240}
      RATE_LIMIT_UPLOAD_PER_MIN: ${RATE_LIMIT_UPLOAD_PER_MIN:-60}
      TRUST_PROXY: ${TRUST_PROXY:-1}
      # Short access token + long rotating refresh token (see docs/sessions.md).
      AUTH_ACCESS_TTL_SECONDS: ${AUTH_ACCESS_TTL_SECONDS:-1800}
      AUTH_REFRESH_TTL_DAYS: ${AUTH_REFRESH_TTL_DAYS:-30}
      # Outgoing e-mail. Without MAIL_HOST the transport stays disabled (log only).
      MAIL_TRANSPORT: ${MAIL_TRANSPORT:-}
      # gmail | zoho | titan | outlook — fills host/port/TLS from the provider preset.
      MAIL_SERVICE: ${MAIL_SERVICE:-}
      MAIL_HOST: ${MAIL_HOST:-}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_SECURE: ${MAIL_SECURE:-}
      MAIL_USER: ${MAIL_USER:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_FROM: ${MAIL_FROM:-}
      MAIL_FROM_NAME: ${MAIL_FROM_NAME:-Vexora Suite}
      MAIL_REPLY_TO: ${MAIL_REPLY_TO:-}
    expose:
      - "3001"
    depends_on:
      migration:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  webhook-worker:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-vexora}:${POSTGRES_PASSWORD:?Configure POSTGRES_PASSWORD no Dokploy}@postgres:5432/${POSTGRES_DB:-vexorasuite}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?Configure JWT_ACCESS_SECRET no Dokploy}
      WEBHOOK_ENCRYPTION_KEY: ${WEBHOOK_ENCRYPTION_KEY:?Configure WEBHOOK_ENCRYPTION_KEY no Dokploy}
      WEBHOOK_WORKER_INTERVAL_MS: ${WEBHOOK_WORKER_INTERVAL_MS:-2000}
      WEBHOOK_WORKER_BATCH_SIZE: ${WEBHOOK_WORKER_BATCH_SIZE:-25}
      # Local liveness marker; it does not claim database/provider health.
      WORKER_HEARTBEAT_FILE: /tmp/vexora-worker-heartbeat
    depends_on:
      migration:
        condition: service_completed_successfully
    command: ["node", "dist/webhook-worker.js"]
    healthcheck:
      test: ["CMD", "node", "-e", "const fs=require('node:fs');const p=process.env.WORKER_HEARTBEAT_FILE;try{const age=Date.now()-fs.statSync(p).mtimeMs;process.exit(Number.isFinite(age)&&age>=0&&age<=60000?0:1)}catch{process.exit(1)}"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  # Periodic jobs (audio triage, workflow cadence, channel health, Asaas reconciliation).
  # This dedicated process is started by default. It keeps provider calls and cadence work
  # outside the HTTP API, while database leases keep a second worker replica safe.
  scheduler-worker:
    volumes:
      - automation_media:/var/lib/vexora/media
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      SCHEDULER_MODE: worker
      SCHEDULER_ROLE: worker
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?Configure JWT_ACCESS_SECRET no Dokploy}
      DATABASE_URL: postgresql://${POSTGRES_USER:-vexora}:${POSTGRES_PASSWORD:?Configure POSTGRES_PASSWORD no Dokploy}@postgres:5432/${POSTGRES_DB:-vexorasuite}
      WAHA_BASE_URL: ${WAHA_BASE_URL:-http://waha:3000}
      WAHA_API_KEY: ${WAHA_API_KEY:-}
      WEBHOOK_ENCRYPTION_KEY: ${WEBHOOK_ENCRYPTION_KEY:?Configure WEBHOOK_ENCRYPTION_KEY no Dokploy}
      # Necessária para cadastrar caixas IMAP/SMTP; a API permanece inicializável sem ela para não interromper o deploy existente.
      INTEGRATION_ENCRYPTION_KEY: ${INTEGRATION_ENCRYPTION_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-}
      LOCAL_VOICE_URL: ${LOCAL_VOICE_URL:-}
      LOCAL_TTS_VOICE: ${LOCAL_TTS_VOICE:-pf_dora}
      API_PUBLIC_URL: ${API_PUBLIC_URL:-https://api.vexorasuite.com.br}
      WEB_PUBLIC_URL: ${WEB_PUBLIC_URL:-https://app.vexorasuite.com.br}
      REALTIME_POLL_MS: ${REALTIME_POLL_MS:-5000}
      REALTIME_EVENT_RETENTION_DAYS: ${REALTIME_EVENT_RETENTION_DAYS:-7}
      # Local liveness marker; it does not claim database/provider health.
      WORKER_HEARTBEAT_FILE: /tmp/vexora-worker-heartbeat
    depends_on:
      migration:
        condition: service_completed_successfully
    command: ["node", "dist/scheduler-worker.js"]
    healthcheck:
      test: ["CMD", "node", "-e", "const fs=require('node:fs');const p=process.env.WORKER_HEARTBEAT_FILE;try{const age=Date.now()-fs.statSync(p).mtimeMs;process.exit(Number.isFinite(age)&&age>=0&&age<=60000?0:1)}catch{process.exit(1)}"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s

  llama-cpp:
    profiles: ["local-ai"]
    image: ghcr.io/ggml-org/llama.cpp:server@sha256:e3032ea0712da96dec820c770626385de4322dd06619fb5829256a504bbc9375
    restart: unless-stopped
    command: ["-m", "/ollama/models/blobs/${LLAMA_CPP_MODEL_BLOB:-sha256-183715c435899236895da3869489cc30ac241476b4971a20285b1a462818a5b4}", "--alias", "qwen2.5:1.5b", "--host", "0.0.0.0", "--port", "8080", "-t", "2", "-c", "8192", "-np", "1"]
    depends_on:
      ollama-model:
        condition: service_completed_successfully
    volumes:
      - ollama_models:/ollama:ro
    mem_limit: 4g
    cpus: 2

  ollama:
    profiles: ["local-ai"]
    image: ollama/ollama:latest
    restart: unless-stopped
    environment:
      OLLAMA_NUM_PARALLEL: "1"
      OLLAMA_MAX_LOADED_MODELS: "1"
      OLLAMA_CONTEXT_LENGTH: "4096"
    volumes:
      - ollama_models:/root/.ollama
    expose:
      - "11434"
    mem_limit: 4g
    cpus: 2
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 30s
      timeout: 5s
      retries: 3
  ollama-model:
    profiles: ["local-ai"]
    image: ollama/ollama:latest
    restart: "no"
    environment:
      OLLAMA_HOST: http://ollama:11434
    command: ["pull", "${OLLAMA_DEFAULT_MODEL:-qwen2.5:1.5b}"]
    depends_on:
      ollama:
        condition: service_healthy
    mem_limit: 256m
  speaches:
    profiles: ["local-ai"]
    image: ghcr.io/speaches-ai/speaches:latest-cpu
    restart: unless-stopped
    environment:
      ENABLE_UI: "false"
      LOG_LEVEL: warning
      WHISPER__INFERENCE_DEVICE: cpu
      WHISPER__COMPUTE_TYPE: int8
      WHISPER__CPU_THREADS: "1"
      # Speaches v0.8.2 shares this TTL across STT and TTS.
      # Release each model after use to stay within the 2 GiB memory limit.
      WHISPER__TTL: "0"
      PRELOAD_MODELS: '["Systran/faster-whisper-small", "speaches-ai/Kokoro-82M-v1.0-ONNX"]'
    volumes:
      - speech_models:/home/ubuntu/.cache/huggingface/hub
    expose:
      - "8000"
    mem_limit: 2g
    cpus: 1
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  lightweight-text-models:
    profiles: ["local-ai"]
    image: python:3.12-alpine
    restart: "on-failure:3"
    command: ["python", "-u", "/opt/vexora/install-text-models.py"]
    volumes:
      - ./infra/speaches/install-text-models.py:/opt/vexora/install-text-models.py:ro
    depends_on:
      ollama:
        condition: service_healthy
    mem_limit: 64m
    cpus: 0.25

  speech-models:
    profiles: ["local-ai"]
    image: python:3.12-alpine
    restart: "on-failure:3"
    command: ["python", "-u", "/opt/vexora/install-models.py"]
    volumes:
      - ./infra/speaches/install-models.py:/opt/vexora/install-models.py:ro
    depends_on:
      speaches:
        condition: service_healthy
    mem_limit: 64m
    cpus: 0.25

  searxng:
    image: docker.io/searxng/searxng:latest
    restart: unless-stopped
    entrypoint: ["/bin/sh", "/opt/vexora/start.sh"]
    environment:
      GRANIAN_WORKERS: "1"
      GRANIAN_BLOCKING_THREADS: "2"
    volumes:
      - ./infra/searxng/settings.yml:/opt/vexora/settings.yml:ro
      - ./infra/searxng/start.sh:/opt/vexora/start.sh:ro
      - searxng_config:/etc/searxng
      - searxng_data:/var/cache/searxng
    expose:
      - "8080"
    mem_limit: 512m
    cpus: 0.5
    healthcheck:
      test: ["CMD", "/usr/local/searxng/.venv/bin/python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-vexora}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Configure POSTGRES_PASSWORD no Dokploy}
      POSTGRES_DB: ${POSTGRES_DB:-vexorasuite}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-vexora} -d ${POSTGRES_DB:-vexorasuite}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  pgadmin:
    profiles: ["maintenance"]
    image: dpage/pgadmin4:latest
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:?Configure PGADMIN_DEFAULT_EMAIL no Dokploy}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:?Configure PGADMIN_DEFAULT_PASSWORD no Dokploy}
      PGADMIN_LISTEN_PORT: "80"
      PGADMIN_CONFIG_ENHANCED_COOKIE_PROTECTION: "True"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    expose:
      - "80"
    depends_on:
      postgres:
        condition: service_healthy

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    expose:
      - "6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10


  waha:
    image: ${WAHA_IMAGE:-devlikeapro/waha:gows}
    restart: unless-stopped
    environment:
      WAHA_API_KEY: ${WAHA_API_KEY:-}
      WHATSAPP_DEFAULT_ENGINE: ${WHATSAPP_DEFAULT_ENGINE:-GOWS}
      WHATSAPP_FILES_LIFETIME: ${WHATSAPP_FILES_LIFETIME:-600}
      WAHA_MEDIA_STORAGE: ${WAHA_MEDIA_STORAGE:-LOCAL}
      # Sem este download, o webhook só informa que existe um anexo e a Véxora não
      # consegue exibir imagem, áudio, vídeo ou documento. Os arquivos ainda expiram
      # conforme WHATSAPP_FILES_LIFETIME e não representam sincronização de histórico.
      WAHA_EVENTS_DOWNLOAD_MEDIA: ${WAHA_EVENTS_DOWNLOAD_MEDIA:-true}
      WAHA_GOWS_DEVICE_REQUIRE_FULL_SYNC: ${WAHA_GOWS_DEVICE_REQUIRE_FULL_SYNC:-false}
      WAHA_GOWS_DEVICE_HISTORY_SYNC_FULL_SYNC_DAYS_LIMIT: ${WAHA_GOWS_DEVICE_HISTORY_SYNC_FULL_SYNC_DAYS_LIMIT:-0}
      WAHA_GOWS_DEVICE_HISTORY_SYNC_RECENT_SYNC_DAYS_LIMIT: ${WAHA_GOWS_DEVICE_HISTORY_SYNC_RECENT_SYNC_DAYS_LIMIT:-0}
      WAHA_GOWS_DEVICE_HISTORY_SYNC_INITIAL_SYNC_MAX_MESSAGES_PER_CHAT: ${WAHA_GOWS_DEVICE_HISTORY_SYNC_INITIAL_SYNC_MAX_MESSAGES_PER_CHAT:-0}
      WAHA_GOWS_DEVICE_HISTORY_SYNC_FULL_SYNC_SIZE_MB_LIMIT: ${WAHA_GOWS_DEVICE_HISTORY_SYNC_FULL_SYNC_SIZE_MB_LIMIT:-1}
      WAHA_GOWS_DEVICE_HISTORY_SYNC_STORAGE_QUOTA_MB: ${WAHA_GOWS_DEVICE_HISTORY_SYNC_STORAGE_QUOTA_MB:-1}
    expose:
      - "3000"
    volumes:
      - waha_sessions:/app/.sessions

volumes:
  ollama_models:
  speech_models:
  searxng_config:
  searxng_data:
  automation_media:
  postgres_data:
  redis_data:
  pgadmin_data:
  waha_sessions:
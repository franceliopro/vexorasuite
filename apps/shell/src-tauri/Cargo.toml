[package]
name = "vexorasuite-shell"
version = "0.1.0"
description = "Véxora Suite Tauri v2 shell (desktop and mobile)"
authors = ["Véxora"]
edition = "2021"
rust-version = "1.77.2"

# Mobile targets need a library crate in addition to the desktop binary.
[lib]
name = "vexorasuite_shell_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }

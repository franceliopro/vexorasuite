name: Tauri builds (native)

on:
  pull_request:
    paths:
      - "apps/native/**"
      - "scripts/gen-icon.mjs"
  workflow_dispatch:
    inputs:
      platform:
        description: 'Platform: all, android, ios, macos, windows'
        default: 'all'

concurrency:
  group: tauri-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    if: github.event.inputs.platform == 'all' || github.event.inputs.platform == 'android' || github.event_name == 'pull_request'
    name: Android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.18.0
          run_install: false
      - name: Setup Rust + Android targets
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal
          source "$HOME/.cargo/env"
          rustup target add aarch64-linux-android armv7-linux-androideabi i686-linux-android x86_64-linux-android
      - name: Install Android SDK
        uses: android-actions/setup-android@v3
      - name: Install pnpm deps
        run: pnpm install --frozen-lockfile
      - name: Build Android APK (debug signing for preview)
        run: |
          source "$HOME/.cargo/env"
          cd apps/native
          npx @tauri-apps/cli android build --apk --debug-apk || npx @tauri-apps/cli android build --apk

  macos:
    if: github.event.inputs.platform == 'all' || github.event.inputs.platform == 'macos' || github.event_name == 'pull_request'
    name: macOS
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.18.0
          run_install: false
      - name: Setup Rust
        run: rustup toolchain install stable --profile minimal
      - name: Install dependencies
        run: |
          brew install libsoup@3 webkitgtk
      - name: Install pnpm deps
        run: pnpm install --frozen-lockfile
      - name: Build macOS
        run: |
          rustup toolchain install stable --profile minimal
          cd apps/native
          npx @tauri-apps/cli build --target aarch64-apple-darwin

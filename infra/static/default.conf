server {
    listen 80 default_server;
    server_name _;

    root /var/www/sites;
    index index.html index.htm default.html;
    autoindex off;
    absolute_redirect off;

    # Sites estáticos residem em /var/www/sites/<slug>/.
    location / {
        try_files $uri $uri/ $uri/index.html =404;
    }
}
